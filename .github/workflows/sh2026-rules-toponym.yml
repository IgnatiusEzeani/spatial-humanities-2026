name: SH2026 rules TOPONYM benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/build_holdout_v1.py"
      - "benchmarks/holdout_v1.sha256"
      - "scripts/run_sh2026_rules_toponym.py"
      - "workshop/data/teaching_gazetteer.csv"
      - ".github/workflows/sh2026-rules-toponym.yml"

jobs:
  rules-toponym:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lite.txt

      - name: Generate and verify frozen holdout
        run: |
          python benchmarks/build_holdout_v1.py
          cd benchmarks
          sha256sum -c holdout_v1.sha256

      - name: Run apples-to-apples rule TOPONYM condition
        run: |
          python scripts/run_sh2026_rules_toponym.py \
            benchmarks/holdout_v1.jsonl \
            --benchmark-mode \
            --frozen-at-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --expected-sha256 be9c526af68230f22cb92507af69d8aacea8cbb5bd7ad5dfcf3d7c16767fdb9b \
            --out-dir sh2026_outputs/rules_toponym_v1

      - name: Print summary
        run: cat sh2026_outputs/rules_toponym_v1/comparison_summary.json

      - name: Upload audit artefact
        uses: actions/upload-artifact@v4
        with:
          name: sh2026-rules-toponym-v1-${{ github.run_id }}
          path: |
            sh2026_outputs/rules_toponym_v1/
            benchmarks/holdout_v1.jsonl
            benchmarks/holdout_v1.sha256
          if-no-files-found: error
          retention-days: 30
