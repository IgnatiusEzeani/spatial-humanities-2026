name: SH2026 LLM journey formal

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    paths:
      - "config/journey_llm_scope"

permissions:
  contents: read

jobs:
  formal-llm-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HOLDOUT_SHA256: fcd985d1727bb924d1b01a91166a1f792f7e15cf2ebf6f126d85eff1ac195453
      SH2026_MODEL: gpt-5.6-sol
      SH2026_REASONING_EFFORT: medium
      SH2026_MAX_OUTPUT_TOKENS: "4096"
      SH2026_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SH2026_SCOPE_FILE: config/journey_llm_scope
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Resolve formal LLM journey trigger
        id: scope
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            SCOPE="formal_holdout"
          else
            if ! git diff --name-only HEAD^ HEAD | grep -Fxq "$SH2026_SCOPE_FILE"; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "scope=none" >> "$GITHUB_OUTPUT"
              echo "Marker was not changed by the latest commit; paid LLM inference is intentionally skipped."
              exit 0
            fi
            SCOPE="$(tr -d '[:space:]' < "$SH2026_SCOPE_FILE")"
          fi
          test "$SCOPE" = "formal_holdout" || {
            echo "Invalid SH2026 LLM journey scope: $SCOPE" >&2
            exit 1
          }
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: ${{ steps.scope.outputs.run == 'true' }}
        with:
          python-version: "3.11"

      - name: Install formal LLM journey environment
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lite.txt
          python -m pip install -r requirements-llm.txt
          mkdir -p sh2026_outputs/llm_journey_formal/inference
          mkdir -p sh2026_outputs/llm_journey_formal/evaluation
          python -m pip freeze > sh2026_outputs/llm_journey_formal/python_environment.txt
          python --version > sh2026_outputs/llm_journey_formal/python_version.txt

      - name: Require OpenAI repository secret
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured; refusing paid formal inference." >&2
            exit 1
          fi

      - name: Build and verify frozen formal holdout
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: |
          python benchmarks/build_holdout_v1.py
          ACTUAL=$(sha256sum benchmarks/holdout_v1.jsonl | cut -d' ' -f1)
          test "$ACTUAL" = "$HOLDOUT_SHA256"

      - name: Generate frozen strict-schema LLM journey predictions
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: |
          python scripts/generate_sh2026_llm_journey_predictions.py \
            benchmarks/holdout_v1.jsonl \
            --model "$SH2026_MODEL" \
            --reasoning-effort "$SH2026_REASONING_EFFORT" \
            --max-output-tokens "$SH2026_MAX_OUTPUT_TOKENS" \
            --benchmark-mode \
            --frozen-at-commit "$SH2026_HEAD_SHA" \
            --expected-sha256 "$HOLDOUT_SHA256" \
            --out-dir sh2026_outputs/llm_journey_formal/inference

      - name: Verify formal LLM inference manifest
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: |
          python - <<'PY'
          import json, os
          p = 'sh2026_outputs/llm_journey_formal/inference/inference_manifest.json'
          d = json.load(open(p, encoding='utf-8'))
          assert d['run_mode'] == 'benchmark'
          assert d['benchmark_sha256'] == os.environ['HOLDOUT_SHA256']
          assert d['frozen_at_commit'] == os.environ['SH2026_HEAD_SHA']
          assert d['examples'] == 30
          assert d['provider'] == 'openai'
          assert d['api'] == 'responses'
          assert d['requested_model'] == os.environ['SH2026_MODEL']
          assert d['reasoning_effort'] == os.environ['SH2026_REASONING_EFFORT']
          assert d['max_output_tokens'] == int(os.environ['SH2026_MAX_OUTPUT_TOKENS'])
          assert d['structured_output'] == 'strict_json_schema'
          assert d['repetitions'] == 1
          assert d['actual_input_tokens'] is not None
          assert d['actual_output_tokens'] is not None
          assert d['estimated_run_cost_usd'] is not None
          print(json.dumps(d, indent=2))
          PY

      - name: Score preserved predictions with frozen journey evaluator
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: |
          python scripts/run_sh2026_journey_benchmark.py \
            benchmarks/holdout_v1.jsonl \
            --predictions sh2026_outputs/llm_journey_formal/inference/journey_predictions.jsonl \
            --benchmark-mode \
            --frozen-at-commit "$SH2026_HEAD_SHA" \
            --expected-sha256 "$HOLDOUT_SHA256" \
            --out-dir sh2026_outputs/llm_journey_formal/evaluation
          cat sh2026_outputs/llm_journey_formal/evaluation/journey_summary.json

      - name: Record formal-condition metadata
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: |
          cat > sh2026_outputs/llm_journey_formal/formal_condition.json <<EOF
          {
            "scope": "formal_holdout",
            "provider": "openai",
            "model": "$SH2026_MODEL",
            "api": "responses",
            "reasoning_effort": "$SH2026_REASONING_EFFORT",
            "max_output_tokens": $SH2026_MAX_OUTPUT_TOKENS,
            "temperature": "not_set_api_default",
            "structured_output": "strict_json_schema",
            "holdout_sha256": "$HOLDOUT_SHA256",
            "sh2026_commit": "$SH2026_HEAD_SHA",
            "journey_match_policy": "sh2026-journey-match-v1",
            "journey_field_policy": "sh2026-journey-field-v1"
          }
          EOF

      - name: Upload formal LLM journey audit artefacts
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sh2026-journey-llm-formal-${{ github.run_id }}
          path: |
            sh2026_outputs/llm_journey_formal/
            docs/LLM_JOURNEY_EXPERIMENT.md
            docs/JOURNEY_MATCHING_POLICY.md
          if-no-files-found: error
          retention-days: 30
