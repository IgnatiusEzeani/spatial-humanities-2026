name: SH2026 project CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-and-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare Colab-like filesystem
        run: |
          sudo mkdir -p /content
          sudo chown "$USER":"$USER" /content

      - name: Install pinned workshop environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lite.txt

      - name: Run project regression tests
        run: python -m pytest -q

      - name: Run no-key release smoke
        run: python scripts/sh2026_workshop_smoke.py
